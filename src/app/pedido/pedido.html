@if (pedido() != null) {
<div class="container">
    <div class="card">
         <div class="card-header bg-danger text-white">
            <h4 class="mb-0">
                <i class="bi bi-cart3 me-2"></i>
                Mi pedido
            </h4>
        </div>
        <div class="card-body">

            @for (item of pedido()!.items; track $index) {
            <h5 class="card-title">{{ item.pizza.name }}</h5>
            <p class="card-text">Cantidad {{ item.amount }} / Precio {{ item.amount*item.pizza.price }}€</p>            
            }
            
             <button class="btn btn-danger btn-lg w-100 fw-bold">
                <i class="bi bi-bag-check me-2"></i>
                Encargar pedido
            </button>
            
        </div>
    </div>
</div>
}
